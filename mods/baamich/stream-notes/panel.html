<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream timer and notes</title>
<style>
  :root { color-scheme: dark; --bg: #10141f; --line: #2a3145; --text: #e6ebff; --dim: #8a93ad; --accent: #ff9f5a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", sans-serif; display: flex; flex-direction: column; gap: 12px; height: 100vh; }
  .time { font: 600 40px/1 Bahnschrift, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: 0.04em; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #1a2030; color: var(--text); font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.main { background: var(--accent); color: #1a1208; border-color: var(--accent); font-weight: 600; }
  label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  textarea { flex: 1; min-height: 80px; resize: none; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #0b0f19; color: var(--text); font: inherit; }
</style>
</head>
<body>
  <div class="time" id="time">00:00:00</div>
  <div class="row">
    <button type="button" class="main" id="go">Старт</button>
    <button type="button" id="reset">Сброс</button>
  </div>
  <label for="notes" id="notesLabel">Заметки</label>
  <textarea id="notes" spellcheck="false" placeholder="Что сказать, кого поздравить, ссылки…"></textarea>
<script>
  // Панель живёт в отдельном браузере панелей: к программе и к файлам компьютера у неё доступа нет.
  const en = !navigator.language.toLowerCase().startsWith('ru');
  if (en) {
    document.documentElement.lang = 'en';
    document.getElementById('go').textContent = 'Start';
    document.getElementById('reset').textContent = 'Reset';
    document.getElementById('notesLabel').textContent = 'Notes';
    document.getElementById('notes').placeholder = 'What to say, who to thank, links…';
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* без памяти тоже работает */ } },
  };
  let started = Number(store.get('efirra-notes-started', '0'));
  let kept = Number(store.get('efirra-notes-kept', '0'));
  const time = document.getElementById('time');
  const go = document.getElementById('go');
  const label = (on) => { go.textContent = on ? (en ? 'Pause' : 'Пауза') : (en ? 'Start' : 'Старт'); };
  const draw = () => {
    const ms = kept + (started ? Date.now() - started : 0);
    const s = Math.floor(ms / 1000);
    const two = (n) => String(n).padStart(2, '0');
    time.textContent = `${two(Math.floor(s / 3600))}:${two(Math.floor(s / 60) % 60)}:${two(s % 60)}`;
  };
  go.addEventListener('click', () => {
    if (started) { kept += Date.now() - started; started = 0; } else { started = Date.now(); }
    store.set('efirra-notes-started', String(started));
    store.set('efirra-notes-kept', String(kept));
    label(Boolean(started));
    draw();
  });
  document.getElementById('reset').addEventListener('click', () => {
    started = 0; kept = 0;
    store.set('efirra-notes-started', '0');
    store.set('efirra-notes-kept', '0');
    label(false);
    draw();
  });
  const notes = document.getElementById('notes');
  notes.value = store.get('efirra-notes-text', '');
  notes.addEventListener('input', () => store.set('efirra-notes-text', notes.value));
  label(Boolean(started));
  draw();
  setInterval(draw, 250);
</script>
</body>
</html>
