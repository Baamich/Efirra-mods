name: Report a mod / Пожаловаться на мод
description: Something wrong with a mod in the list / С модом из списка что-то не так
labels: [report]
body:
  - type: input
    id: mod
    attributes:
      label: Mod / Мод
      description: Name and developer / Название и разработчик
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong / Что не так
      description: Please do not post private data here, this page is public / Не пишите здесь личных данных, страница открыта всем
    validations:
      required: true
